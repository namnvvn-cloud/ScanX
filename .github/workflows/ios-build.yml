name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ScanX.xcodeproj \
            -scheme ScanX

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project ScanX.xcodeproj \
            -scheme ScanX \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Bản Release cho iPhone thật (không ký) — kiểm tra cấu hình tối ưu + báo dung lượng app.
      - name: Build Release for iOS device (size check)
        run: |
          xcodebuild build \
            -project ScanX.xcodeproj \
            -scheme ScanX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          du -sh "$APP"
          du -sh "$APP"/* | sort -h | tail -10
          echo "::notice title=iOS app size (Release, arm64)::$(du -sh "$APP" | cut -f1) — $(du -sh "$APP"/Frameworks 2>/dev/null | cut -f1) frameworks"
