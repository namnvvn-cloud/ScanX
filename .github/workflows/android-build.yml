name: Build ScanX debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tat cache Gradle: moi lan push cache-key doi theo commit nen cache moi lien tuc
      # duoc tao ma khong tai su dung, lam day nhanh han muc luu tru Actions mien phi
      # (500MB, dung chung artifacts + caches) -> khien buoc upload APK bi chan du build
      # van thanh cong. Tat han de khong ton dung luong; danh doi la moi lan build tai lai
      # dependency (~2-3 phut), chap nhan duoc o giai doan free-tier hien tai.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      # Bản "preview": R8 thu gọn + tối ưu, không debuggable (mượt hơn bản debug), tách APK theo CPU.
      # Vẫn applicationId com.scanx.app.debug + khoá ký test cố định → cài đè bản cũ, giữ tài liệu.
      - name: Build preview APKs (arm64 + armv7)
        run: ./gradlew :app:assemblePreview --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/preview/app-arm64-v8a-preview.apk ../dist/ScanX.apk
          cp app/build/outputs/apk/preview/app-armeabi-v7a-preview.apk ../dist/ScanX-armv7.apk
          ls -la ../dist
          # Thành phần lớn nhất trong APK (để theo dõi dung lượng)
          unzip -lv ../dist/ScanX.apk | sort -k3 -n -r | head -15 || true

      # Actions Artifact storage (500MB free-tier, dung chung ca tai khoan) bi chan va chi
      # duoc GitHub tinh lai sau 6-12 tieng du da don cache -> khong dung upload-artifact
      # nua. Thay bang dinh file APK vao 1 GitHub Release: dung luong Release KHONG tinh
      # vao quota Actions Storage, tai APK on dinh ngay ca khi quota Actions dang day.
      - name: Upload APK artifact (best-effort, co the bi chan boi quota Actions Storage)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: scanx-apk
          path: dist/*.apk
          retention-days: 5

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "ScanX debug build #${{ github.run_number }} (${{ github.sha }})"
          body: |
            APK tu dong build tu commit ${{ github.sha }}.
            ScanX.apk: dien thoai 64-bit (hau het may). ScanX-armv7.apk: may 32-bit doi cu.
            Copy vao dien thoai Android de cai (bat "Cai tu nguon khong xac dinh").
          prerelease: true
          files: dist/*.apk
