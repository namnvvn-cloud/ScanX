name: Build ScanX debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tat cache Gradle: moi lan push cache-key doi theo commit nen cache moi lien tuc
      # duoc tao ma khong tai su dung, lam day nhanh han muc luu tru Actions mien phi
      # (500MB, dung chung artifacts + caches) -> khien buoc upload APK bi chan du build
      # van thanh cong. Tat han de khong ton dung luong; danh doi la moi lan build tai lai
      # dependency (~2-3 phut), chap nhan duoc o giai doan free-tier hien tai.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 5
